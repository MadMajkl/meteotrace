<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>MeteoTrace — kontrola rozvržení</title>
<style>
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:#f6f8fa; color:#111; }
  header { padding:14px 16px; border-bottom:1px solid #d0d7de; background:#fff; }
  h1 { margin:0 0 4px; font-size:16px; }
  .muted { color:#57606a; font-size:12px; }
  #summary { padding:12px 16px; font-weight:700; }
  .row { display:flex; gap:16px; overflow-x:auto; padding:16px; align-items:flex-start; }
  .case { flex:none; }
  .case h2 { margin:0 0 6px; font-size:13px; font-weight:600; }
  .case .verdict { font-size:12px; font-weight:700; }
  .ok { color:#1a7f37; } .bad { color:#cf222e; }
  iframe { border:1px solid #d0d7de; border-radius:8px; background:#fff; display:block; height:760px; }
</style>
</head>
<body>

<header>
  <h1>Kontrola rozvržení na úzkých displejích</h1>
  <div class="muted">
    Appka běží v rámech o skutečné šířce displeje, takže se měří opravdový viewport —
    ne okno headless prohlížeče. Hlídá se, že <b>nic nepřetéká vodorovně</b> a že se
    <b>ovládací prvky nepřekrývají</b> — a to na obou obrazovkách, na místě i na trase.
  </div>
</header>

<div id="summary">Načítám…</div>
<div class="row" id="cases"></div>

<script>
/* ──────────────────────────────────────────────────────────────
   PROČ TENHLE TEST EXISTUJE

   Poučení z Gulpky: pozvánka do Play byla odladěná na Pixelu 7 a vypadala
   dobře — na iPhonu SE, iPhonu 12/13, Pixelu 5 i Galaxy S20 přitom začínala
   až za spodní hranou. Jedna šířka displeje nestačí.

   Headless prohlížeč navíc `--window-size` nepromítne spolehlivě do layoutu,
   takže screenshot může být uříznutý, i když je CSS v pořádku (a naopak).
   Rám o pevné šířce dá skutečný viewport a odpověď bez dohadů.
   ────────────────────────────────────────────────────────────── */

// Šířky, na kterých se to musí vejít. 320 = iPhone SE, 360 = Galaxy,
// 390 = iPhone 12/13, 412 = Pixel, 430 = velké telefony.
const WIDTHS = [320, 360, 390, 412, 430];
// nomap=1: bez mapy. Pět rámů s vlastním MapLibre a WebGL by stránku
// přetížilo a rozvržení se na mapě neměří (div s pevnou výškou).
const APP = '/?lat=50.0755&lon=14.4378&name=Praha&lang=cs&nomap=1';

/* Uložená místa: řádek s odkazy je nejširší obsah hlavičky, takže se musí
   měřit taky. Prázdný seznam se schová celý a neotestoval by nic — proto
   se před měřením nasype pár míst, mezi nimi schválně jedno s dlouhým jménem.

   ⚠️ Rámy sdílejí úložiště s appkou, takže se původní obsah nejdřív schová
   a po měření vrátí. Kdo si tuhle stránku otevře ve svém prohlížeči, nesmí
   kvůli testu přijít o svoje uložená místa. */
const PLACES_KEY = 'meteotrace.places.v1';
const previousPlaces = localStorage.getItem(PLACES_KEY);

localStorage.setItem(PLACES_KEY, JSON.stringify({
  version: 1,
  places: [
    { key: '50.076,14.438', lat: 50.0755, lon: 14.4378, name: 'Praha', country: 'Česko', savedAt: 3, usedAt: 3 },
    { key: '50.638,14.116', lat: 50.6381, lon: 14.1158, name: 'Ústí nad Labem-Střekov', country: 'Česko', savedAt: 2, usedAt: 2 },
    { key: '49.195,16.607', lat: 49.1951, lon: 16.6068, name: 'Brno', country: 'Česko', savedAt: 1, usedAt: 1 },
  ],
  routes: [],
}));

const cases = document.getElementById('cases');
const frames = [];

for (const w of WIDTHS) {
  const box = document.createElement('div');
  box.className = 'case';
  box.innerHTML = `<h2>${w} px</h2><div class="verdict" id="v-${w}">…</div>`;
  const f = document.createElement('iframe');
  f.width = w;
  f.src = APP;
  box.append(f);
  cases.append(box);
  frames.push({ w, f });
}

/**
 * Jméno prvku do hlášky.
 *
 * ⚠️ `el.className` je u SVG objekt, ne řetězec — vypsalo by se
 * „svg.[object SVGAnimatedString]" a viník by se z hlášky nepoznal.
 */
function popisPrvku(el) {
  const trida = (el.getAttribute('class') || '').split(' ')[0];
  return el.tagName.toLowerCase() + (trida ? '.' + trida : '');
}

/** Přeteklo něco vodorovně? Vrací i viníka, ať se nemusí hádat. */
function overflow(doc) {
  const root = doc.documentElement;
  const limit = root.clientWidth;
  const total = Math.max(root.scrollWidth, doc.body.scrollWidth);
  if (total <= limit + 1) return null;                    // 1 px na zaokrouhlení

  // Najdi prvek, který sahá nejdál doprava — obvykle to je ten, co to způsobil.
  let worst = null, worstRight = limit;
  for (const el of doc.querySelectorAll('body *')) {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.right > worstRight + 1) { worstRight = r.right; worst = el; }
  }
  return {
    total, limit,
    culprit: worst ? popisPrvku(worst) : '?',
    right: Math.round(worstRight),
  };
}

/**
 * Nejhorší případy do karty pylu.
 *
 * ⚠️ Nejdelší slova, jaká tam můžou být: „Velmi vysoká" u druhu s dlouhým
 * jménem. Na 320 px je to ta nejtěsnější dvojice v celé appce.
 */
function nasypPyl(doc) {
  const karta = doc.getElementById('pollen-card');
  const list = doc.getElementById('pollen');
  if (!karta || !list) return;
  karta.hidden = false;
  const vzorky = [
    ['Ambrózie peřenolistá', 'veryHigh', 'Velmi vysoká'],
    ['Trávy', 'moderate', 'Střední'],
    ['Bříza bělokorá', 'none', 'Žádný'],
  ];
  list.replaceChildren();
  for (const [jmeno, uroven, text] of vzorky) {
    const li = doc.createElement('li');
    li.dataset.level = uroven;
    const jm = doc.createElement('span');
    jm.className = 'pollen-name';
    const svg = doc.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'pollen-icon');
    svg.setAttribute('viewBox', '0 0 24 24');
    const txt = doc.createElement('span');
    txt.textContent = jmeno;
    jm.append(svg, txt);
    const lvl = doc.createElement('span');
    lvl.className = 'lvl';
    lvl.dataset.level = uroven;
    lvl.textContent = text;
    li.append(jm, lvl);
    list.append(li);
  }
}

/**
 * 🚨 PŘEKRÝVÁ SE NĚCO S NĚČÍM? Přetečení z okna je jen jedna polovina.
 *
 * Ta druhá stála 29. 8. 2026 volbu „Vzdušnou čarou": pruh způsobů dopravy
 * se nezalomil, ale smrskl, a poslední tlačítko vylezlo POD sousední
 * „Ukázat počasí". Z okna nepřeteklo nic, takže test hlásil ✓ — a volba
 * přitom nešla přečíst ani trefit. Našlo se to až na snímku obrazovky.
 *
 * Měří se jen dvojice, které mají stát VEDLE SEBE v jednom pruhu; překryv
 * karty s nadpisem uvnitř ní je v pořádku a hledat se nemá.
 *
 * 🚨 A porovnávají se OVLÁDACÍ PRVKY, ne přímí sourozenci. Napoprvé jsem
 * srovnával děti pruhu — jenže `.modes` má šířku, kterou mu přidělil
 * flexbox, a jeho obsah leze ven mimo ni. Obálka se s tlačítkem vedle sebe
 * nepřekrývala, ačkoli tlačítka uvnitř ano, a kontrola tu vadu propásla
 * všude kromě nejužšího displeje. Nástroj, který měří něco jiného, než si
 * myslí, je horší než žádný.
 */
function prekryvy(doc) {
  const nalezy = [];
  for (const pruh of doc.querySelectorAll('.route-controls, .tabs, .brand, .search')) {
    const deti = [...pruh.querySelectorAll('button, input, select, a')]
      .filter((el) => el.getBoundingClientRect().width > 0);
    for (let i = 0; i < deti.length; i++) {
      for (let j = i + 1; j < deti.length; j++) {
        const a = deti[i].getBoundingClientRect();
        const b = deti[j].getBoundingClientRect();
        const vodorovne = a.right > b.left + 1 && b.right > a.left + 1;
        const svisle = a.bottom > b.top + 1 && b.bottom > a.top + 1;
        if (vodorovne && svisle) {
          nalezy.push(`${deti[i].id || deti[i].className} × ${deti[j].id || deti[j].className}`);
        }
      }
    }
  }
  return [...new Set(nalezy)];
}

/**
 * Rozbalí nabídku v hlavičce.
 *
 * 🚨 Od 29. 8. 2026 se hlavička po vybrání místa SBALÍ — a rám má místo
 * v adrese, takže by se měřil jeden řádek se značkou. Jenže nejširší obsah
 * appky je pořád tam: řádek uložených míst a tras. Bez tohohle by test
 * mlčky přestal měřit to, kvůli čemu vznikl.
 */
function rozbalNabidku(doc) {
  const btn = doc.getElementById('btn-menu');
  if (btn && btn.getAttribute('aria-expanded') === 'false') btn.click();
}

/** Nejhorší případy do karty výstrah — jinak by se měřila prázdná karta. */
function nasypVystrahy(doc) {
  const card = doc.getElementById('warnings-card');
  const list = doc.getElementById('warnings-list');
  if (!card || !list) return;
  card.hidden = false;
  const vzorky = [
    ['warn-unknown', 'Neznámá závažnost', 'Velmi silné bouřky a přívalové srážky · 14:00–18:00',
     'Platí pro Brandýs nad Labem-Stará Boleslav, Ústí nad Labem-Střekov.'],
    ['warn-severe', 'Vysoká', 'Vysoké teploty · do 17:00', 'Platí pro Litoměřice.'],
    ['warn-minor', 'Nízká', 'Vysoké riziko požárů · do 08:00', 'Nepodařilo se přesně určit, kde platí.'],
  ];
  list.replaceChildren();
  for (const [trida, badge, titul, kde] of vzorky) {
    const li = doc.createElement('li');
    li.className = 'warn ' + trida;
    const b = doc.createElement('span'); b.className = 'warn-badge'; b.textContent = badge;
    const h = doc.createElement('strong'); h.className = 'warn-title'; h.textContent = titul;
    const k = doc.createElement('span'); k.className = 'warn-where'; k.textContent = kde;
    li.append(b, h, k);
    list.append(li);
  }
}

/**
 * 🚨 DIALOG SE NEMĚŘÍ SÁM: je užší než okno a vycentrovaný, takže obsah,
 * který z něj vyleze, ještě nemusí přetéct ze STRÁNKY — a `overflow()` ho
 * proto neuvidí. Nejtěsnější je tu QR kód: má pevnou velikost a na úzkém
 * displeji je to jediná věc v appce, která se nemá jak zalomit.
 *
 * Vrací popis vady, nebo `null`.
 */
function dialogPreteceni(doc, id) {
  const d = doc.getElementById(id);
  if (!d) return `dialog #${id} ve stránce není`;
  const box = d.getBoundingClientRect();
  let worst = null, worstRight = box.right;
  for (const el of d.querySelectorAll('*')) {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.right > worstRight + 1) { worstRight = r.right; worst = el; }
  }
  if (!worst) return null;
  return `${popisPrvku(worst)} leze z dialogu o ${Math.round(worstRight - box.right)} px`;
}

async function run() {
  await Promise.all(frames.map(({ f }) => new Promise((res) => {
    if (f.contentDocument?.readyState === 'complete') res();
    else f.addEventListener('load', res, { once: true });
  })));

  // Nech doběhnout dotazy na data — prázdná stránka nepřeteče nikdy.
  await new Promise((r) => setTimeout(r, 4000));

  // ⚠️ Karta výstrah bývá prázdná — v ČR většinu času žádná výstraha neplatí,
  // takže by se na ní nezměřilo nic. Před měřením se proto nasypou schválně
  // ty nejhorší případy: nejdelší štítek závažnosti („Neznámá závažnost")
  // a dlouhý název jevu vedle sebe na jednom řádku.
  for (const { f } of frames) {
    rozbalNabidku(f.contentDocument);
    nasypVystrahy(f.contentDocument);
    nasypPyl(f.contentDocument);
  }

  let failed = 0;
  const results = [];
  for (const { w, f } of frames) {
    const cell = document.getElementById('v-' + w);
    const doc = f.contentDocument;
    const vady = [];

    try {
      // 1) Meteostanice — obrazovka, na které je nejvíc obsahu.
      const o = overflow(doc);
      if (o) vady.push(`Místo: přetéká o ${o.total - o.limit} px (${o.culprit} sahá na ${o.right})`);
      for (const p of prekryvy(doc)) vady.push(`Místo: překryv ${p}`);

      // 2) ⚠️ A TAKY TRASA. Do 29. 8. 2026 se neměřila vůbec — a přesně tam
      //    se schovala volba „Vzdušnou čarou" pod tlačítko vedle sebe.
      doc.getElementById('tab-route').click();
      rozbalNabidku(doc);
      const o2 = overflow(doc);
      if (o2) vady.push(`Trasa: přetéká o ${o2.total - o2.limit} px (${o2.culprit} sahá na ${o2.right})`);
      for (const p of prekryvy(doc)) vady.push(`Trasa: překryv ${p}`);

      // 3) Dialogy. Dar sem přibyl 30. 8. 2026 kvůli QR kódu — ten se na
      //    úzkém displeji nemá jak zalomit, takže je to nejtěsnější prvek
      //    v celé appce.
      doc.getElementById('btn-settings').click();
      const vNastaveni = dialogPreteceni(doc, 'settings-dialog');
      if (vNastaveni) vady.push(`Nastavení: ${vNastaveni}`);
      doc.getElementById('btn-donate').click();
      const vDaru = dialogPreteceni(doc, 'donate-dialog');
      if (vDaru) vady.push(`Dar: ${vDaru}`);
      doc.getElementById('donate-dialog').close();
    } catch (e) {
      vady.push('nešlo změřit: ' + e.message);
    }

    if (!vady.length) {
      cell.textContent = '✓ vejde se';
      cell.className = 'verdict ok';
      results.push({ width: w, ok: true });
    } else {
      cell.textContent = '✕ ' + vady.join(' · ');
      cell.className = 'verdict bad';
      failed++;
      results.push({ width: w, ok: false, detail: vady.join(' · ') });
    }
  }

  // Úložiště patří uživateli, ne testu.
  if (previousPlaces === null) localStorage.removeItem(PLACES_KEY);
  else localStorage.setItem(PLACES_KEY, previousPlaces);

  // Výsledek si přečte tools/layout-check.mjs přes ladicí protokol.
  window.__layoutResult = { cases: results };

  const s = document.getElementById('summary');
  s.textContent = failed
    ? `✕ ${failed} z ${WIDTHS.length} šířek má vadu rozvržení.`
    : `✓ Všech ${WIDTHS.length} šířek se vejde a nic se nepřekrývá.`;
  s.className = failed ? 'bad' : 'ok';
  document.title = (failed ? 'FAIL' : 'OK') + ' — kontrola rozvržení';
}

run();
</script>
</body>
</html>
