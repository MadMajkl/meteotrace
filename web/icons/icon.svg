<!--
  Ikona MeteoTrace: zlaté slunce nad trasou.

  ⚠️ TOHLE JE ZDROJ PRAVDY. PNG verze pro manifest a iPhone se z ní vyrábějí
  příkazem `npm run icons` — do repa nepatří pět ručně kreslených bitmap,
  které se při každé úpravě rozejdou.

  ════════════════════════════════════════════════════════════════════════
  🚨 POZADÍ JE OBLOHA, NE PLOCHÁ MODRÁ (od 23. 9. 2026)

  Michal: *„má moc tmavou modrou v pozadí, to neevokuje nebe."* Měl pravdu:
  plochá `#0E5490` vznikla 27. 8. 2026 z nouze o kontrast — zlaté slunce
  mělo na světlejší modré jen 2,7 : 1 a na šestnácti pixelech z něj byla
  teplá skvrna.

  Přechod řeší obojí. Nahoře zůstává hluboká modrá, na které slunce drží
  (4,8 : 1 u horního okraje kotouče, 4,2 : 1 u spodního), dole se rozsvítí
  jako obloha u obzoru — a bílá trasa na ní má pořád 4,1 : 1.

  ⚠️ Světlá barva patří DOLŮ. Obloha je nejtmavší v zenitu a světlá
  u obzoru; obráceně by to vypadalo jako zatažené nebe nad světlou zemí.
  ⚠️ `theme-color` v `index.html` a `theme_color` v `manifest.json` drží
  horní barvu přechodu — jsou to jednobarevná pole a lišta má navazovat
  na to, co je nahoře.

  ════════════════════════════════════════════════════════════════════════
  🚨 KRESBA SE VEJDE DO KRUHU O POLOMĚRU 33 KOLEM STŘEDU

  Kvůli Androidu: adaptivní ikonu ořezává maska podle výrobce telefonu
  a zaručený je jen vnitřní kruh o průměru 66 ze 108. Do 23. 9. 2026 se
  kresba jen zmenšovala a konce trasy i horní paprsek maska ukusovala.
  Teď je překreslená tak, aby se vešla sama — viz
  `android/…/ic_launcher_foreground.xml`, kde jsou tytéž souřadnice,
  a `test/selftest-ikona.mjs`, který to počítá z obou souborů.
  ════════════════════════════════════════════════════════════════════════
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="obloha" x1="54" y1="0" x2="54" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E5490"/>
      <stop offset="0.58" stop-color="#105A99"/>
      <stop offset="1" stop-color="#4598E0"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#obloha)"/>

  <!-- slunce: kotouč a paprsky; tenké by se na 16 px ztratily -->
  <circle cx="54" cy="43" r="12" fill="#FFC83D"/>
  <g stroke="#FFC83D" stroke-width="6" stroke-linecap="round">
    <path d="M54,27.5 L54,24.5"/>
    <path d="M64.96,32.04 L67.08,29.92"/>
    <path d="M43.04,32.04 L40.92,29.92"/>
    <path d="M69.5,43 L72.5,43"/>
    <path d="M38.5,43 L35.5,43"/>
  </g>

  <!-- trasa pod sluncem -->
  <path d="M34,70.5 C45.5,70.5 47,63 54,63 C61,63 62.5,70.5 74,70.5"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
</svg>
