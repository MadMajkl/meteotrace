<!--
  Ikona MeteoTrace: kapka na trase.

  ⚠️ TOHLE JE ZDROJ PRAVDY. PNG verze pro manifest a iPhone se z ní vyrábějí
  příkazem `npm run icons` — do repa nepatří pět ručně kreslených bitmap,
  které se při každé úpravě rozejdou.

  Kresba odpovídá androidí `ic_launcher_foreground.xml` a barvě pozadí
  `ic_launcher_background` (#1A7FD4), aby appka vypadala stejně na ploše
  telefonu i na webu.
-->
