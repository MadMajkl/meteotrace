  <rect width="108" height="108" fill="#1A7FD4"/>

  <!-- trasa -->
  <path d="M30,74 C42,74 44,58 54,58 C64,58 66,74 78,74"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- kapka nad trasou -->
  <path d="M54,26 C54,26 42,40 42,47 A12,12 0 1,0 66,47 C66,40 54,26 54,26 Z"
        fill="#FFFFFF"/>
