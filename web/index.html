<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<!-- Kde leží podkladová mapa (R3). Archiv má 1,4 GB, takže neleží u appky,
     ale v objektovém úložišti — a jeho adresa se liší podle nasazení.
     Prázdná hodnota = soubor vedle appky, tak to jede při vývoji.
     ⚠️ Doména musí umět Range i CORS, jinak se z archivu nenačte nic. -->
<meta name="meteotrace:tiles" content="https://pub-0f518418db5b4a73b99caba2c28954c6.r2.dev/cz.pmtiles">
<title>MeteoTrace</title>
<meta name="description" content="Weather along your route — at every point, at the time you actually get there.">
<!-- PWA: bez manifestu si appku nikdo nenainstaluje na plochu a na iPhonu,
     kde nativní appka nebude, je to jediná cesta k ní (R1). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a7fd4">
<!-- ⚠️ Safari SVG jako ikonu nepřijme, proto PNG (vyrábí `npm run icons`). -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◈</span>
    <span class="brand-name" data-i18n="app.name">MeteoTrace</span>
    <!-- Jazyk a jednotky. V hlavičce, protože appka, která mluví cizí řečí,
         je k nepotřebě hned — ne až se člověk proklikne do nastavení. -->
    <button id="btn-settings" class="icon-btn settings" type="button"
            data-i18n-attr="aria-label:settings.title|title:settings.title">⚙</button>
  </div>
  <form class="search" id="search-form" role="search" autocomplete="off">
    <input id="search-input" type="search"
           data-i18n-attr="placeholder:search.placeholder|aria-label:search.placeholder">
    <button type="button" id="btn-locate" class="icon-btn"
            data-i18n-attr="title:search.myLocation|aria-label:search.myLocation">⌖</button>
  </form>
  <ul id="search-results" class="results" hidden></ul>

  <!-- Přepínač obrazovek. Dvě záložky, ne schované menu: appka umí dvě věci
       a obě mají být na dosah palce. -->
  <nav class="tabs" data-i18n-attr="aria-label:nav.sections">
    <button id="tab-station" class="tab" type="button" aria-selected="true" data-i18n="nav.station"></button>
    <button id="tab-route" class="tab" type="button" aria-selected="false" data-i18n="nav.route"></button>
  </nav>

  <!-- Uložená místa. Jedno klepnutí = přepnutí, proto jsou v hlavičce
       a ne schovaná v nastavení. -->
  <nav id="saved" class="saved" hidden aria-labelledby="saved-title">
    <h2 id="saved-title" class="sr-only" data-i18n="places.savedAll"></h2>
    <ul id="saved-list" class="chips"></ul>
    <!-- Správa je zvlášť: řádek nahoře slouží k PŘEPNUTÍ jedním klepnutím,
         přejmenování a mazání by se do něj pletlo. -->
    <button id="btn-manage" class="icon-btn manage" type="button" data-i18n-attr="aria-label:places.manage|title:places.manage">⋯</button>
  </nav>
</header>

<!-- Správa uložených míst. Nativní <dialog>: ohlídá si zavření klávesou Esc,
     vrácení ohniska i to, že se pod ním nedá klikat. -->
<dialog id="places-dialog" class="sheet" aria-labelledby="places-dialog-title">
  <div class="sheet-head">
    <h2 id="places-dialog-title" data-i18n="places.manageTitle"></h2>
    <button id="places-close" class="icon-btn" type="button" data-i18n-attr="aria-label:places.close|title:places.close">✕</button>
  </div>
  <!-- ⚠️ Že jde jméno přepsat, není poznat ze samotného pole — Michal to
       nenašel (25. 8. 2026). Řekne se to rovnou, i s příklady. -->
  <p class="hint" data-i18n="places.renameHint"></p>
  <p id="places-note" class="hint" hidden></p>
  <ul id="places-manage" class="manage-list"></ul>

  <!-- Trasy ve stejném dialogu jako místa: je to jedno „co mám uložené".
       Přejmenovat je nejdou — jméno „Praha → Brno" si appka drží sama. -->
  <h3 data-i18n="routes.title"></h3>
  <p id="routes-note" class="hint" hidden></p>
  <ul id="routes-manage" class="manage-list"></ul>
</dialog>

<!-- Jazyk a jednotky. Jednotky jsou SAMOSTATNÁ OSA, ne součást jazyka (R10):
     Američan mluvící česky existuje a pilot chce vítr v m/s, i když appka
     mluví anglicky. -->
<dialog id="settings-dialog" class="sheet" aria-labelledby="settings-dialog-title">
  <div class="sheet-head">
    <h2 id="settings-dialog-title" data-i18n="settings.title"></h2>
    <button id="settings-close" class="icon-btn" type="button"
            data-i18n-attr="aria-label:places.close|title:places.close">✕</button>
  </div>

  <div class="setting">
    <label for="set-lang" data-i18n="settings.language"></label>
    <select id="set-lang"></select>
  </div>

  <div class="setting">
    <label for="set-primary" data-i18n="settings.primary"></label>
    <select id="set-primary"></select>
  </div>
  <p class="hint" data-i18n="settings.primaryHint"></p>

  <div class="setting">
    <label for="set-theme" data-i18n="settings.theme"></label>
    <select id="set-theme"></select>
  </div>

  <h3 data-i18n="settings.units"></h3>
  <p class="hint" data-i18n="settings.unitsNote"></p>

  <div class="setting">
    <label for="set-temp" data-i18n="settings.temperature"></label>
    <select id="set-temp"></select>
  </div>
  <div class="setting">
    <label for="set-wind" data-i18n="settings.wind"></label>
    <select id="set-wind"></select>
  </div>
  <div class="setting">
    <label for="set-precip" data-i18n="settings.precipitation"></label>
    <select id="set-precip"></select>
  </div>
  <div class="setting">
    <label for="set-distance" data-i18n="settings.distance"></label>
    <select id="set-distance"></select>
  </div>

  <!-- ⚠️ Uvedení zdrojů není zdvořilost, ale podmínka licence: podklad mapy
       stojí na datech OpenStreetMap (ODbL) a ta se musí přiznat. -->
  <h3 data-i18n="settings.about"></h3>
  <p class="hint" id="about-version"></p>
  <p class="hint" data-i18n="settings.sources"></p>
</dialog>

<!-- Pruh se objeví jen když jsou data stará nebo se něco nepovedlo. -->
<div id="notice" class="notice" hidden role="status"></div>

<main id="station" hidden>

  <section class="now card" aria-labelledby="place-name">
    <div class="place-row">
      <h1 class="place" id="place-name"></h1>
      <button id="btn-save" class="star" type="button" aria-pressed="false">
        <span class="star-icon" aria-hidden="true">☆</span>
        <span class="star-text"></span>
      </button>
    </div>
    <!-- Vysvětlí rozsvícenou hvězdičku u místa, které uživatel neukládal —
         viz `savedAs()`. Jindy je prázdný. -->
    <p id="saved-as" class="hint" hidden></p>

    <div class="now-main">
      <span class="now-icon" id="now-icon" aria-hidden="true"></span>
      <div>
        <div class="now-temp" id="now-temp"></div>
        <div class="now-cond" id="now-cond"></div>
        <div class="now-feels"><span data-i18n="now.feelsLike"></span> <b id="now-feels"></b></div>
      </div>
    </div>

    <dl class="details">
      <div><dt data-i18n="now.wind"></dt><dd id="d-wind"></dd></div>
      <div><dt data-i18n="now.gusts"></dt><dd id="d-gusts"></dd></div>
      <div><dt data-i18n="now.humidity"></dt><dd id="d-humidity"></dd></div>
      <div><dt data-i18n="now.precipitation"></dt><dd id="d-precip"></dd></div>
      <div><dt data-i18n="now.cloudCover"></dt><dd id="d-cloud"></dd></div>
      <div><dt data-i18n="now.uvIndex"></dt><dd id="d-uv"></dd></div>
      <div><dt data-i18n="now.sunrise"></dt><dd id="d-sunrise"></dd></div>
      <div><dt data-i18n="now.sunset"></dt><dd id="d-sunset"></dd></div>
    </dl>

    <p class="updated" id="now-updated"></p>
  </section>

  <!-- Výstrahy. Nikdy se neschovává celá karta, jen proto, že je seznam prázdný:
       „žádné výstrahy" a „výstrahy se nepodařilo načíst" musí jít rozeznat. -->
  <section class="card warnings-card" id="warnings-card" hidden aria-labelledby="h-warnings">
    <h2 id="h-warnings" data-i18n="warnings.title"></h2>
    <p id="warnings-note" class="hint" hidden></p>
    <ul class="warnings" id="warnings-list"></ul>
  </section>

  <!-- Přípojné místo mapy. Táž mapa slouží meteostanici i trase; druhá
       instance MapLibre by na telefonu byla zbytečná daň (R0). -->
  <div id="station-map-slot">
  <section class="card map-card" aria-labelledby="h-radar">
    <h2 id="h-radar" data-i18n="radar.title"></h2>
    <div id="map" class="map"></div>
    <div class="radar-bar">
      <button id="radar-play" class="icon-btn" type="button" data-i18n-attr="aria-label:radar.play">▶</button>
      <span id="radar-time" class="radar-time"></span>
      <span id="radar-kind" class="radar-kind"></span>
    </div>
    <!-- Bez tohohle by o výběru klepnutím nikdo nevěděl: mapa nevypadá
         jako něco, do čeho se dá ukázat. -->
    <p class="hint map-hint" id="map-hint" data-i18n="radar.pickHint"></p>
  </section>
  </div>

  <section class="card" aria-labelledby="h-hourly">
    <h2 id="h-hourly" data-i18n="forecast.hourly"></h2>
    <div class="hours" id="hours"></div>
  </section>

  <section class="card" aria-labelledby="h-daily">
    <h2 id="h-daily" data-i18n="forecast.daily"></h2>
    <ul class="days" id="days"></ul>
  </section>

  <!-- Karta se NESCHOVÁVÁ, když pyl nelítá nebo data nejsou. „Klid" a „nevíme"
       se od sebe musí dát rozeznat — schovaná karta neřekne ani jedno. -->
  <section class="card" id="pollen-card" hidden aria-labelledby="h-pollen">
    <h2 id="h-pollen" data-i18n="pollen.title"></h2>
    <p id="pollen-note" class="hint" hidden></p>
    <ul class="pollen" id="pollen"></ul>
  </section>

</main>

<main id="route" hidden>

  <section class="card" aria-labelledby="h-route-form">
    <h2 id="h-route-form" data-i18n="route.title"></h2>

    <div class="route-form">
      <label class="route-field">
        <span data-i18n="route.from"></span>
        <input id="route-from" type="search" autocomplete="off"
               data-i18n-attr="placeholder:route.fromPlaceholder">
        <ul id="route-from-results" class="results inline" hidden></ul>
      </label>

      <!-- Prohození je tam schválně: cesta zpátky je nejčastější druhý dotaz. -->
      <button id="route-swap" class="icon-btn" type="button" data-i18n-attr="title:route.swap">⇅</button>

      <label class="route-field">
        <span data-i18n="route.to"></span>
        <input id="route-to" type="search" autocomplete="off"
               data-i18n-attr="placeholder:route.toPlaceholder">
        <ul id="route-to-results" class="results inline" hidden></ul>
      </label>
    </div>

    <!-- Mezibody. Vznikají až na vyžádání: většina cest je z A do B a dvě
         prázdná pole navíc by z jednoduché věci dělala formulář. -->
    <div id="route-via" class="route-via"></div>
    <button id="route-add-via" class="link-btn" type="button" data-i18n="route.addVia"></button>

    <div class="route-controls">
      <div class="modes" id="route-modes" role="group" data-i18n-attr="aria-label:route.mode"></div>
      <button id="route-go" class="primary" type="button" data-i18n="route.compute"></button>
    </div>

    <!-- Ukazuje se jen u vzdušné čáry: u silnice rychlost zná router,
         u letu ji nemá kdo odhadnout. -->
    <label class="route-speed" id="route-speed-row" hidden>
      <span data-i18n="route.speed"></span>
      <input id="route-speed" type="number" min="1" max="1200" step="10" value="90" inputmode="numeric">
      <small class="hint" data-i18n="route.speedHint"></small>
    </label>

    <p id="route-note" class="hint" hidden></p>
  </section>

  <section class="card" id="route-summary-card" hidden aria-labelledby="h-route-summary">
    <h2 id="h-route-summary" class="sr-only" data-i18n="route.summary"></h2>
    <div class="place-row">
      <p id="route-summary" class="route-summary"></p>
      <button id="btn-save-route" class="star" type="button" aria-pressed="false">
        <span class="star-icon" aria-hidden="true">☆</span>
        <span class="star-text"></span>
      </button>
    </div>
    <p id="route-advice" class="route-advice" hidden></p>

    <!-- Rozpis úseků. Jen u trasy se zastávkami — u cesty z A do B by jen
         zopakoval, co je v souhrnu. -->
    <ul id="route-legs" class="legs" hidden></ul>

    <!-- Srovnání odjezdů (R8, bod 3). Je zadarmo: hodinová pole pro všechny
         body už jsou stažená, jiný odjezd je jen jiný index v paměti. -->
    <div class="departures" id="route-departures" role="group"
         data-i18n-attr="aria-label:route.departure"></div>
  </section>

  <!-- Sem se mapa přesune, když je otevřená trasa. -->
  <div id="route-map-slot"></div>

  <section class="card" id="route-points-card" hidden aria-labelledby="h-route-points">
    <h2 id="h-route-points" data-i18n="route.alongTheWay"></h2>
    <ol class="route-points" id="route-points"></ol>
  </section>

</main>

<div id="splash" class="splash">
  <span class="brand-mark big" aria-hidden="true">◈</span>
  <p id="splash-text"></p>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
