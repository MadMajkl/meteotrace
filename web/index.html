<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<!-- Kde leží podkladová mapa (R3). Archiv má 1,4 GB, takže neleží u appky,
     ale v objektovém úložišti — a jeho adresa se liší podle nasazení.
     Prázdná hodnota = soubor vedle appky, tak to jede při vývoji.
     ⚠️ Doména musí umět Range i CORS, jinak se z archivu nenačte nic. -->
<meta name="meteotrace:tiles" content="https://pub-0f518418db5b4a73b99caba2c28954c6.r2.dev/cz.pmtiles">
<!-- ══ CO O SOBĚ APPKA ŘEKNE VYHLEDÁVAČŮM A PŘI SDÍLENÍ ═════════════════
     🚨 Tohle je JEDINÉ, co si robot přečte bez spuštění JavaScriptu.
     Appka se celá kreslí skriptem, takže mimo tuhle hlavičku je stránka
     pro vyhledávač prázdná — a odkaz poslaný do chatu by byl holý řádek
     bez obrázku a bez popisu.

     ⚠️ ČESKY, i když referenční jazyk kódu je angličtina. Doména cílí na
     Česko a lidé sem doputují přes česká slova („počasí na trase"), ne
     přes „weather along route". Appka sama se pak přepne podle prohlížeče;
     tenhle text je vizitka, ne obsah. -->
<title>MeteoTrace — počasí na trase i meteostanice pro tvoje místo</title>
<meta name="description" content="Předpověď počasí v každém bodě cesty v čase, kdy tam doopravdy dorazíš. K tomu meteostanice pro jedno místo, srážkový radar s hodinovou předpovědí a výstrahy ČHMÚ.">
<link rel="canonical" href="https://meteotrace.com/">

<!-- Náhled při sdílení (Facebook, Messenger, LinkedIn, Slack…).
     ⚠️ Obrázek MUSÍ být absolutní adresa — relativní si žádná z těch
     služeb nedoplní a náhled zůstane prázdný. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://meteotrace.com/">
<meta property="og:title" content="MeteoTrace — počasí na trase">
<meta property="og:description" content="Počasí v každém bodě cesty v čase, kdy tam doopravdy dorazíš. A meteostanice pro tvoje místo.">
<meta property="og:image" content="https://meteotrace.com/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="MeteoTrace — počasí na trase">
<meta property="og:locale" content="cs_CZ">
<meta property="og:site_name" content="MeteoTrace">

<!-- Twitter/X má vlastní sadu. `summary_large_image` = velký náhled;
     bez ní se ukáže čtvereček velikosti ikony. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MeteoTrace — počasí na trase">
<meta name="twitter:description" content="Počasí v každém bodě cesty v čase, kdy tam doopravdy dorazíš.">
<meta name="twitter:image" content="https://meteotrace.com/icons/og.png">

<!-- PWA: bez manifestu si appku nikdo nenainstaluje na plochu a na iPhonu,
     kde nativní appka nebude, je to jediná cesta k ní (R1). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e5490">
<!-- ⚠️ Safari SVG jako ikonu nepřijme, proto PNG (vyrábí `npm run icons`). -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<!-- Strukturovaná data pro vyhledávač. ⚠️ Popisují to, co appka OPRAVDU
     dělá — vymyšlené hodnocení nebo cena, které nikde nejsou, znamenají
     u Googlu postih, ne lepší pozici. `price: 0` je pravda: appka je
     zdarma a nic neodemyká (viz R8, dary nesmí nic odemknout). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "MeteoTrace",
  "url": "https://meteotrace.com/",
  "applicationCategory": "TravelApplication",
  "operatingSystem": "Any",
  "inLanguage": ["cs", "en"],
  "description": "Předpověď počasí v každém bodě cesty v čase, kdy tam doopravdy dorazíš. Meteostanice pro jedno místo, srážkový radar s hodinovou předpovědí a výstrahy ČHMÚ.",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CZK" }
}
</script>

<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <!-- 🚨 ZNAČKA JE TLAČÍTKO NABÍDKY. Hledání, záložky a uložené věci zabíraly
       na telefonu skoro třetinu displeje, i když se člověk zrovna díval na
       mapu (Michal 29. 8. 2026: „ten pás je moc vertikálně široký").
       Sbalená hlavička je jeden řádek — a ten řádek MUSÍ říct, co je vidět
       dole, jinak by zmizely i záložky a nebylo by poznat, kde vlastně jsem. -->
  <div class="brand">
    <button id="btn-menu" class="brand-toggle" type="button"
            aria-expanded="true" aria-controls="top-menu">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-name" data-i18n="app.name">MeteoTrace</span>
      <span class="brand-sipka" aria-hidden="true">▾</span>
      <span class="brand-kontext" id="brand-kontext"></span>
    </button>
    <!-- Jazyk a jednotky. V hlavičce, protože appka, která mluví cizí řečí,
         je k nepotřebě hned — ne až se člověk proklikne do nastavení.
         ⚠️ Mimo tlačítko nabídky: tlačítko uvnitř tlačítka není platné HTML
         a klepnutí na ozubené kolo by rozbalovalo nabídku. -->
    <!-- Srdíčko vedle ozubeného kola (Michal 30. 8. 2026: „přes to vlak
         nejede"). ♻️ Obrací rozhodnutí z téhož dne, kdy dar seděl POUZE
         v nastavení — dar, který se musí hledat, nikdo nedá.
         ⚠️ Znak, ne emoji: v hlavičce už jsou ◈ ⚙ ⌖ ▾ a emoji by se mezi
         nimi kreslilo jinou sadou, jinou velikostí a v barvě, kterou
         motivu nevnutíš. -->
    <button id="btn-donate-top" class="icon-btn mince" type="button"
            data-i18n-attr="aria-label:donate.open|title:donate.open">
      <!-- ⚠️ TOTÁŽ MINCE JAKO V GULPCE, ne vlastní výmysl. Zlatý kotouč se
           srdcem uvnitř; kdo zná jednu appku, pozná ji i tady. Gradient má
           vlastní `id`, protože v dokumentu smí být jen jednou. -->
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="mince-zlato" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#FFEFA8"/>
            <stop offset="48%"  stop-color="#F6C544"/>
            <stop offset="100%" stop-color="#D2920F"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="12" r="9.3" fill="url(#mince-zlato)" stroke="#A9750C" stroke-width="1.2"/>
        <circle cx="12" cy="12" r="6.7" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
        <path d="M12 15.6 C12 15.6 8.1 13.2 8.1 10.7 C8.1 9.4 9.05 8.6 10.05 8.6 C10.8 8.6 11.5 9.05 12 9.8 C12.5 9.05 13.2 8.6 13.95 8.6 C14.95 8.6 15.9 9.4 15.9 10.7 C15.9 13.2 12 15.6 12 15.6 Z"
              fill="#fff7e0" stroke="#A9750C" stroke-width="0.6"/>
      </svg>
    </button>
    <button id="btn-settings" class="icon-btn settings" type="button"
            data-i18n-attr="aria-label:settings.title|title:settings.title">⚙</button>
  </div>

  <div id="top-menu" class="top-menu">
  <!-- Přepínač obrazovek. Dvě záložky, ne schované menu: appka umí dvě věci
       a obě mají být na dosah palce. -->
  <nav class="tabs" data-i18n-attr="aria-label:nav.sections">
    <button id="tab-station" class="tab" type="button" aria-selected="true" data-i18n="nav.station"></button>
    <button id="tab-route" class="tab" type="button" aria-selected="false" data-i18n="nav.route"></button>
  </nav>

  <!-- Uložená místa. Jedno klepnutí = přepnutí, proto jsou v hlavičce
       a ne schovaná v nastavení. -->
  <nav id="saved" class="saved" hidden aria-labelledby="saved-title">
    <h2 id="saved-title" class="sr-only" data-i18n="places.savedAll"></h2>

    <!-- Dvě pojmenované skupiny, ne jeden shluk. Vlevo nadpis, který se dá
         rozklepnout na úplný seznam; vedle tolik posledních, kolik se
         doopravdy vejde (změřeno, ne odhadnuto — viz lib/fit-row.js). -->
    <div class="saved-group" id="group-routes" hidden>
      <button class="saved-toggle" id="routes-toggle" type="button"
              aria-expanded="false" aria-controls="routes-panel">
        <span data-i18n="routes.mine"></span><span class="sipka" aria-hidden="true">▾</span>
      </button>
      <ul id="saved-routes-list" class="chips chips-fit"></ul>
      <ul id="routes-panel" class="saved-panel" hidden></ul>
    </div>

    <div class="saved-group" id="group-places" hidden>
      <button class="saved-toggle" id="places-toggle" type="button"
              aria-expanded="false" aria-controls="places-panel">
        <span data-i18n="places.mine"></span><span class="sipka" aria-hidden="true">▾</span>
      </button>
      <ul id="saved-list" class="chips chips-fit"></ul>
      <!-- ⚠️ Správa (přejmenování, mazání) je POSLEDNÍ ŘÁDEK rozbaleného
           seznamu, ne tlačítko v hlavičce. Ve sloupci širokém 155 px se ⋯
           nevešlo a vystrkovalo obsah z okna — a hlavně: spravovat chci
           tehdy, když se na seznam dívám. -->
      <ul id="places-panel" class="saved-panel" hidden></ul>
    </div>
  </nav>

  <!-- 🚨 HLEDÁNÍ AŽ POD ZÁLOŽKAMI, ne nad nimi. Do 31. 8. 2026 sedělo pole
       „Najít místo…" NAD přepínačem Trasa/Místo, kdežto formulář trasy je
       POD ním — dvě obrazovky téže appky měly opačné pořadí. Michal:
       *„u místa máš ten input form nad tlačítkem Místo a v Trasách je to
       pod… sjednoť to u místa stejně jako u Trasy."*
       Teď mají obě totéž pořadí: záložky → uložené → vstupní pole. -->
  <form class="search" id="search-form" role="search" autocomplete="off">
    <!-- ⚠️ ⌖ je UVNITŘ pole, ne vedle něj — táž konvence jako u pole Odkud
         u trasy (`.vstup-s-akci`). Dřív to byl samostatný rámeček vpravo
         od pole; vedle trasy to četlo jako jiný druh ovládání. -->
    <span class="vstup-s-akci">
      <input id="search-input" type="search"
             data-i18n-attr="placeholder:search.placeholder|aria-label:search.placeholder">
      <button type="button" id="btn-locate" class="vstup-akce"
              data-i18n-attr="title:search.myLocation|aria-label:search.myLocation">⌖</button>
    </span>
  </form>
  <ul id="search-results" class="results" hidden></ul>
  </div><!-- /#top-menu -->
</header>

<!-- ══ UVÍTÁNÍ PŘI PRVNÍM SPUŠTĚNÍ ══════════════════════════════════════
     Čtyři kroky: domov → oblíbený cíl → ukázka meteostanice → ukázka trasy.
     Po nich má appka uložený domov, cíl i trasu — není prázdná.

     🚨 Poslední dva kroky ukazují ŽIVOU APPKU, ne obrázky. Snímek by se za
     měsíc rozešel s tím, co appka doopravdy dělá, a nikdo by si toho
     nevšiml — uvítání nikdo znovu neotevře. Proto je to jen proužek
     přes skutečnou obrazovku.

     🚨 „Přeskočit" je vidět na každém kroku. Někdo si appku otevře
     v obchodě; uvítání, ze kterého se nedá utéct, je past.

     Rozhodování (komu se ukáže, kolik má kroků) je v `lib/onboarding.js`. -->
<div id="uvitani" class="uvitani" hidden role="dialog" aria-modal="true"
     aria-labelledby="uvitani-nadpis">

  <div class="uvitani-list" id="uvitani-list">
    <div class="uvitani-hlava">
      <!-- Značka je tu poprvé a naposledy takhle velká — je to jediné
           místo, kde má smysl se představit. -->
      <div class="uvitani-znacka" id="uvitani-znacka" hidden>
        <span class="brand-mark big" aria-hidden="true">◈</span>
        <span class="uvitani-jmeno" data-i18n="app.name">MeteoTrace</span>
      </div>
      <button id="uvitani-skip" class="link-btn uvitani-skip" type="button"
              data-i18n="onboarding.skip"></button>
    </div>

    <h2 id="uvitani-nadpis"></h2>
    <p id="uvitani-text" class="uvitani-text"></p>

    <!-- Hledání. Vlastní pole, ne to z hlavičky: hlavička je v tuhle
         chvíli schovaná za překryvem a sdílet jedno pole mezi dvěma
         obrazovkami by znamenalo, že si vzájemně mažou rozepsaný text. -->
    <div class="uvitani-hledani" id="uvitani-hledani" hidden>
      <label class="sr-only" id="uvitani-popisek" for="uvitani-input"></label>
      <div class="uvitani-pole">
        <input id="uvitani-input" type="search" autocomplete="off">
        <!-- ⚠️ Poloha je DRUHÁ možnost, ne první. Žádost o polohu hned na
             uvítací obrazovce lidé často odmítnou — a zpátky se pak
             dostává těžko. -->
        <button id="uvitani-locate" class="icon-btn" type="button"
                data-i18n-attr="title:onboarding.homeLocate|aria-label:onboarding.homeLocate">⌖</button>
      </div>
      <ul id="uvitani-vysledky" class="results inline" hidden></ul>
      <p id="uvitani-vybrano" class="uvitani-vybrano" hidden></p>
    </div>

    <p id="uvitani-poznamka" class="hint" hidden></p>

    <div class="uvitani-paticka">
      <span class="uvitani-tecky" id="uvitani-tecky" aria-hidden="true"></span>
      <button id="uvitani-zpet" class="link-btn" type="button" data-i18n="onboarding.back"></button>
      <button id="uvitani-dal" class="primary" type="button"></button>
    </div>
  </div>
</div>

<!-- Proužek přes živou appku pro poslední dva kroky. -->
<div id="uvitani-pruh" class="uvitani-pruh" hidden>
  <div class="uvitani-pruh-text">
    <strong id="uvitani-pruh-nadpis"></strong>
    <span id="uvitani-pruh-text"></span>
  </div>
  <button id="uvitani-pruh-dal" class="primary" type="button"></button>
</div>

<!-- Potažení dolů = načíst znovu. Pruh visí pod hlavičkou a vytahuje ho prst;
     🚨 každý stav má SVOJE SLOVO — samotné kolečko neřekne, jestli se něco
     stalo, nebo jestli appka jen zamrzla. `aria-live` to řekne i nahlas. -->
<div id="pull" class="pull" aria-hidden="true">
  <div class="pull-box">
    <span class="pull-ico" id="pull-ico" aria-hidden="true">↓</span>
    <span class="pull-text" id="pull-text" role="status" aria-live="polite"></span>
  </div>
</div>

<!-- Správa uložených míst. Nativní <dialog>: ohlídá si zavření klávesou Esc,
     vrácení ohniska i to, že se pod ním nedá klikat. -->
<dialog id="places-dialog" class="sheet" aria-labelledby="places-dialog-title">
  <div class="sheet-head">
    <h2 id="places-dialog-title" data-i18n="places.manageTitle"></h2>
    <button id="places-close" class="icon-btn" type="button" data-i18n-attr="aria-label:places.close|title:places.close">✕</button>
  </div>
  <!-- ⚠️ Že jde jméno přepsat, není poznat ze samotného pole — Michal to
       nenašel (25. 8. 2026). Řekne se to rovnou, i s příklady. -->
  <p class="hint" data-i18n="places.renameHint"></p>
  <p id="places-note" class="hint" hidden></p>

  <!-- Záhlaví tabulky. ⚠️ Skryje se, když nemá co popisovat — dva popisky
       nad prázdným seznamem vypadají jako rozbité vykreslení. -->
  <div class="manage-hlavicka" id="places-hlavicka" hidden aria-hidden="true">
    <span data-i18n="places.addressCol"></span>
    <span data-i18n="places.nameCol"></span>
  </div>
  <ul id="places-manage" class="manage-list"></ul>

  <!-- Trasy ve stejném dialogu jako místa: je to jedno „co mám uložené".
       Přejmenovat je nejdou — jméno „Praha → Brno" si appka drží sama. -->
  <h3 data-i18n="routes.title"></h3>
  <p id="routes-note" class="hint" hidden></p>
  <ul id="routes-manage" class="manage-list"></ul>
</dialog>

<!-- Jazyk a jednotky. Jednotky jsou SAMOSTATNÁ OSA, ne součást jazyka (R10):
     Američan mluvící česky existuje a pilot chce vítr v m/s, i když appka
     mluví anglicky. -->
<dialog id="settings-dialog" class="sheet" aria-labelledby="settings-dialog-title">
  <div class="sheet-head">
    <h2 id="settings-dialog-title" data-i18n="settings.title"></h2>
    <button id="settings-close" class="icon-btn" type="button"
            data-i18n-attr="aria-label:places.close|title:places.close">✕</button>
  </div>

  <div class="setting">
    <label for="set-lang" data-i18n="settings.language"></label>
    <select id="set-lang"></select>
  </div>

  <!-- ⚠️ Domeček je KRESBA, ne emoji. Emoji si kreslí systém: jinou sadou,
       jinou velikostí a v barvě, kterou motivu nevnutíš — vedle ostatních
       popisků nastavení pak čte jako cizí prvek. Tahle čárová kresba jede
       na `currentColor`, takže se v tmavém i růžovém motivu obarví sama.
       ⚠️ SVG je MIMO značku `data-i18n`: ta přepisuje `textContent`, takže
       by kresbu při každé změně jazyka smazala. -->
  <div class="setting">
    <label class="setting-s-ikonou" for="set-primary">
      <svg class="setting-ikona" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3.9 10.9 12 4.3l8.1 6.6"/>
        <path d="M6.3 12.4v6.9h11.4v-6.9"/>
        <path d="M10.1 19.3v-4.2h3.8v4.2"/>
      </svg>
      <span data-i18n="settings.primary"></span>
    </label>
    <select id="set-primary"></select>
  </div>

  <div class="setting">
    <label for="set-theme" data-i18n="settings.theme"></label>
    <select id="set-theme"></select>
  </div>

  <!-- Upozornění na výstrahy. Karta výstrah se při klidu schovává, takže
       tohle je jediná cesta, jak se o bouřce dozvědět, aniž by člověk
       appku sám otevřel. -->
  <div class="setting">
    <label for="set-notify" data-i18n="notify.setting"></label>
    <select id="set-notify"></select>
  </div>
  <!-- ⚠️ MUSÍ být poznat, CO se hlídá a jestli to vůbec může fungovat.
       Přepínač, který tvrdí „zapnuto", zatímco Android upozornění zahazuje,
       se od funkčního nedá odlišit — a přijde se na to až tím, že nedorazí
       výstraha. -->
  <p class="hint" id="notify-note" hidden></p>

  <h3 data-i18n="settings.units"></h3>
  <p class="hint" data-i18n="settings.unitsNote"></p>

  <div class="setting">
    <label for="set-temp" data-i18n="settings.temperature"></label>
    <select id="set-temp"></select>
  </div>
  <div class="setting">
    <label for="set-wind" data-i18n="settings.wind"></label>
    <select id="set-wind"></select>
  </div>
  <div class="setting">
    <label for="set-precip" data-i18n="settings.precipitation"></label>
    <select id="set-precip"></select>
  </div>
  <div class="setting">
    <label for="set-distance" data-i18n="settings.distance"></label>
    <select id="set-distance"></select>
  </div>

  <!-- Podpora appky (R7).
       🚨 Dar NIC neodemyká a nikdy nesmí — jinak z něj je platba za digitální
       obsah a spadne pod povinný Play Billing. Že se nic neodemyká, se tady
       taky NAPÍŠE: nabídka platby v jinak bezplatné appce jinak vypadá jako
       past na peníze a člověk ji radši obejde. -->
  <h3 data-i18n="donate.title"></h3>
  <p class="hint" data-i18n="donate.nothing"></p>
  <!-- 🚨 SLUNÍČKO SE SRDCEM, ne holý text. Michal 31. 8. 2026: *„podpořit
       appku, chybí tam zase srdíčko v tlačítku nebo udělat tlačítko jako
       sluníčko se srdíčkem místo mince."* Vybráno sluníčko: značka
       MeteoTrace JE zlaté slunce (`icons/icon.svg`), takže je to táž
       myšlenka jako gulpkovská mince — zlatý kotouč se srdcem — jen řečená
       naší značkou. Zlato i srdce jsou proto opsané z mince v hlavičce
       (`#FFEFA8 → #F6C544 → #D2920F`, srdce `#fff7e0` s obrysem `#A9750C`),
       ať to nejsou dvě různá zlata na jedné obrazovce.

      <span class="route-collapsed-akce" data-i18n="route.edit"></span>
    </button>

    <div id="route-form-body">
    <div class="route-form">
      <!-- 🚨 „ODKUD = MOJE POLOHA" MUSÍ JÍT ZADAT. Do 31. 8. 2026 tu ⌖ nebylo
           a polohu si appka brala sama jen tehdy, když se trasa spouštěla
           z jiného místa (`polohaProStart()`) — kdo si formulář vyplňoval
           ručně, tu volbu neměl vůbec. Michal: *„při zadávání trasy není
           možné použít mojí aktuální polohu."*
           ⚠️ Jen u pole Odkud. „Kam = moje poloha" je cesta na místo, kde
           člověk stojí — appka by ji spočítala a tvářila se, že je v pořádku. -->
      <label class="route-field">
        <span data-i18n="route.from"></span>
        <span class="vstup-s-akci">
          <input id="route-from" type="search" autocomplete="off"
                 data-i18n-attr="placeholder:route.fromPlaceholder">
          <button type="button" id="route-from-locate" class="vstup-akce"
                  data-i18n-attr="title:search.myLocation|aria-label:search.myLocation">⌖</button>
        </span>
        <ul id="route-from-results" class="results inline" hidden></ul>
      </label>

      <!-- Prohození je tam schválně: cesta zpátky je nejčastější druhý dotaz. -->
      <button id="route-swap" class="icon-btn" type="button" data-i18n-attr="title:route.swap">⇅</button>

      <label class="route-field">
        <span data-i18n="route.to"></span>
        <input id="route-to" type="search" autocomplete="off"
               data-i18n-attr="placeholder:route.toPlaceholder">
        <ul id="route-to-results" class="results inline" hidden></ul>
      </label>
    </div>

    <!-- Mezibody. Vznikají až na vyžádání: většina cest je z A do B a dvě
         prázdná pole navíc by z jednoduché věci dělala formulář. -->
    <div id="route-via" class="route-via"></div>
    <button id="route-add-via" class="link-btn" type="button" data-i18n="route.addVia"></button>

    <div class="route-controls">
      <div class="modes" id="route-modes" role="group" data-i18n-attr="aria-label:route.mode"></div>
      <button id="route-go" class="primary" type="button" data-i18n="route.compute"></button>
    </div>

    <!-- Ukazuje se jen u vzdušné čáry: u silnice rychlost zná router,
         u letu ji nemá kdo odhadnout. -->
    <label class="route-speed" id="route-speed-row" hidden>
      <span data-i18n="route.speed"></span>
      <input id="route-speed" type="number" min="1" max="1200" step="10" value="90" inputmode="numeric">
      <small class="hint" data-i18n="route.speedHint"></small>
    </label>

    <p id="route-note" class="hint" hidden></p>
    </div>
  </section>

  <!-- ♻️ SOUHRN JE NAD MAPOU. 28. 8. 2026 to bylo obráceně (mapa nahoru,
       „aby se dostala do hlavního view"), jenže tím se to hlavní číslo —
       kdy tam dorazíš — odsunulo pod obrazovku. Michal 30. 8. 2026:
       „prohoď u trasy dlaždici s příjezdem nad tu dlaždici se srážkovým
       radarem."

       ⚠️ Původní důvod tím nepadá: souhrn je jen pár řádků, takže mapa
       zůstává vidět hned pod ním — ne pod třemi kartami, jak to bylo
       před 28. 8. -->
  <section class="card" id="route-summary-card" hidden aria-labelledby="h-route-summary">
    <h2 id="h-route-summary" class="sr-only" data-i18n="route.summary"></h2>
    <div class="place-row">
      <p id="route-summary" class="route-summary"></p>
      <button id="btn-save-route" class="star" type="button" aria-pressed="false">
        <span class="star-icon" aria-hidden="true">☆</span>
        <span class="star-text"></span>
      </button>
    </div>
    <!-- Co tam zastihneš. Nejdůležitější věta na obrazovce — proto hned
         pod souhrnem a větším písmem než rozpis. -->
    <p id="route-arrival" class="route-arrival" hidden></p>
    <p id="route-advice" class="route-advice" hidden></p>

    <!-- Táž dlaždice hlášek jako u místa — na trase je to totéž sdělení
         a nemá důvod vypadat jinak.

         · route-quip   — hláška k trase; u nebezpečného počasí se neukáže
         · route-around — kde nejblíž prší od trasy / kam za sluncem -->
    <div class="quips" id="route-quips" hidden>
      <span class="quips-ico" id="ico-note-route" aria-hidden="true"></span>
      <div class="quips-text">
        <p id="route-quip" class="route-quip" hidden></p>
        <p id="route-around" class="route-quip" hidden></p>
      </div>
    </div>

    <!-- Rozpis úseků. Jen u trasy se zastávkami — u cesty z A do B by jen
         zopakoval, co je v souhrnu. -->
    <ul id="route-legs" class="legs" hidden></ul>

    <!-- Srovnání odjezdů (R8, bod 3). Je zadarmo: hodinová pole pro všechny
         body už jsou stažená, jiný odjezd je jen jiný index v paměti. -->
    <div class="departures" id="route-departures" role="group"
         data-i18n-attr="aria-label:route.departure"></div>
  </section>

  <!-- Sem se mapa přesune, když je otevřená trasa. -->
  <div id="route-map-slot"></div>

  <!-- 🚨 LEGENDA BAREV. Bez ní je barva bodu hádanka: mapa ukazuje čtyři
       odstíny a nikde nestojí, co který znamená. Michal 30. 8. 2026 chtěl
       vysvětlivky u bodů — tohle odpovídá na tu častější otázku („proč je
       ten bod červený?"), aniž by se muselo cokoli rozklikávat.

       ⚠️ Puntíky si barvu berou z `ROUTE_COLORS` v map.js, ne z CSS —
       dvě sady odstínů by se rozešly a legenda by pak vysvětlovala barvy,
       které v mapě nejsou. -->

  <!-- 🚨 „Po cestě" JE HLAVNÍ OBSAH OBRAZOVKY A ZŮSTÁVÁ ROZBALENÉ.
       ♻️ 31. 8. 2026 jsem ho omylem sbalil — Michal chtěl sbalit legendu
       „Body na trase" pod mapou, ne rozpis počasí. *„Tos pěkně pokazil…
       počasí po cestě musí být rozbalené."* Je to odpověď na otázku, kvůli
       které se appka otevírá; schovat ji za klepnutí je proti smyslu R8. -->
  <section class="card" id="route-points-card" hidden aria-labelledby="h-route-points">
    <h2 id="h-route-points" data-i18n="route.alongTheWay"></h2>
    <ol class="route-points" id="route-points"></ol>
  </section>

</main>

<div id="splash" class="splash">
  <span class="brand-mark big" aria-hidden="true">◈</span>
  <p id="splash-text"></p>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
